<form class="search-form" method="GET" action="{{ url_for('dashboard') }}">
    <input
        type="text"
        name="q"
        placeholder="Search by title, filename, category, or owner"
        value="{{ search_query }}"
        aria-label="Search documents"
    >

    <label for="start-date">Start date</label>
    <input
        type="date"
        id="start-date"
        name="start_date"
        value="{{ start_date }}"
        aria-label="Start date"
    >

    <label for="end-date">End date</label>
    <input
        type="date"
        id="end-date"
        name="end_date"
        value="{{ end_date }}"
        aria-label="End date"
    >

    <button class="search-btn" type="submit">Search</button>

    {% if search_query or start_date or end_date %}
        <a class="clear-btn" href="{{ url_for('dashboard') }}">
            Clear filters
        </a>
    {% endif %}
</form>
