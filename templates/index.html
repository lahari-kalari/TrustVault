
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrustVault | Secure Documents</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin-bottom: 0;
            color: #cbd5e1;
        }

        main {
            max-width: 900px;
            margin: 70px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px 24px;
            border-radius: 14px;
            box-shadow: 0 8px 25px #0f172a12;
        }

        .icon {
            font-size: 48px;
        }

        h2 {
            color: #172554;
            font-size: 30px;
        }

        .description {
            color: #64748b;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 16px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            font-size: 14px;
        }

        footer {
            margin-top: 30px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <header>
        <h1>TrustVault</h1>
        <p>Secure Document Sharing Platform</p>
    </header>

    <main>
        <section class="card">
            <div class="icon">🔐</div>

            <h2>Welcome to TrustVault</h2>

            <p class="description">
                A secure platform to manage documents,
                control access, and maintain an audit trail.
            </p>

                        <div class="status">
                Secure document sharing made simple
            </div>

            <div style="margin-top: 24px;">
                <a href="{{ url_for('login') }}"
                   style="display: inline-block; padding: 12px 24px; margin: 6px; background: #172554; color: white; text-decoration: none; border-radius: 8px;">
                    Login
                </a>

                <a href="{{ url_for('register') }}"
                   style="display: inline-block; padding: 12px 24px; margin: 6px; background: #e2e8f0; color: #172554; text-decoration: none; border-radius: 8px;">
                    Register
                </a>
            </div>
        </section>

        <footer>
            TrustVault | Secure Access. Trusted Records.
        </footer>
    </main>
</body>
</html>
